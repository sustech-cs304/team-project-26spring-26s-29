name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend tools tests

      - name: Check Node syntax
        shell: pwsh
        run: ./tools/ci/check-node-syntax.ps1

      - name: Run tests
        run: npm test

      - name: Install metrics tools
        run: python -m pip install --disable-pip-version-check lizard

      - name: Generate metrics report
        shell: pwsh
        run: ./tools/ci/generate-metrics-report.ps1

      - name: Upload metrics report
        uses: actions/upload-artifact@v7
        with:
          name: project-metrics-report
          path: metrics-report.txt
          archive: false

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: ./tools/ci/prepare-windows-python.ps1

      - name: Verify bundled Python
        shell: pwsh
        run: ./tools/ci/verify-windows-python.ps1

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:win

      - name: Report output sizes
        shell: pwsh
        run: ./tools/ci/report-dist-output-sizes.ps1

      - name: Resolve installer artifact paths
        id: artifact-paths
        shell: pwsh
        run: ./tools/ci/resolve-installer-artifacts.ps1

      - name: Upload installer executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-exe
          path: ${{ steps.artifact-paths.outputs.installer_path }}
          archive: false

      - name: Upload installer blockmap
        if: ${{ steps.artifact-paths.outputs.blockmap_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-blockmap
          path: ${{ steps.artifact-paths.outputs.blockmap_path }}
          archive: false

      - name: Upload installer metadata
        if: ${{ steps.artifact-paths.outputs.metadata_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-metadata
          path: ${{ steps.artifact-paths.outputs.metadata_path }}
          archive: false

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/ci/publish-github-release.ps1
