name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-win:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/electron/*.test.js

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force vendor/windows-python -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force vendor/windows-python | Out-Null

          Invoke-WebRequest `
            -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" `
            -OutFile "python-embed.zip"

          Expand-Archive "python-embed.zip" -DestinationPath "vendor/windows-python"

          $pth = Get-ChildItem "vendor/windows-python" -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) {
            throw "Failed to find python._pth in vendor/windows-python."
          }

          (Get-Content $pth.FullName) `
            -replace '^#import site$', 'import site' `
            | Set-Content $pth.FullName

          Invoke-WebRequest `
            -Uri "https://bootstrap.pypa.io/get-pip.py" `
            -OutFile "get-pip.py"

          & "vendor/windows-python/python.exe" "get-pip.py"
          & "vendor/windows-python/python.exe" -m pip install --upgrade pip
          & "vendor/windows-python/python.exe" -m pip install -r backend/requirements.txt

      - name: Verify bundled Python
        shell: pwsh
        run: |
          & "vendor/windows-python/python.exe" -c "import fastapi, uvicorn, tinydb, agent_framework; print('ok')"

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
