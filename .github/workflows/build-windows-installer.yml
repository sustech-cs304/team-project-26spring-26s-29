name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          Remove-Item -Recurse -Force vendor/windows-python -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force vendor/windows-python | Out-Null

          Invoke-WebRequest `
            -Uri "https://www.python.org/ftp/python/3.14.4/python-3.14.4-embed-amd64.zip" `
            -OutFile "python-embed.zip"

          Expand-Archive "python-embed.zip" -DestinationPath "vendor/windows-python"

          $pth = Get-ChildItem "vendor/windows-python" -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) {
            throw "Failed to find python._pth in vendor/windows-python."
          }

          (Get-Content $pth.FullName) `
            -replace '^#import site$', 'import site' `
            | Set-Content $pth.FullName

          Invoke-WebRequest `
            -Uri "https://bootstrap.pypa.io/get-pip.py" `
            -OutFile "get-pip.py"

          & "vendor/windows-python/python.exe" "get-pip.py"
          & "vendor/windows-python/python.exe" -m pip install `
            --upgrade `
            --disable-pip-version-check `
            --no-cache-dir `
            --no-warn-script-location `
            pip `
            setuptools `
            wheel
          & "vendor/windows-python/python.exe" -m pip install `
            --disable-pip-version-check `
            --no-cache-dir `
            --no-compile `
            --no-warn-script-location `
            -r backend/requirements.txt

      - name: Verify bundled Python
        shell: pwsh
        run: |
          & "vendor/windows-python/python.exe" -m pip --version
          & "vendor/windows-python/python.exe" -c "import fastapi, uvicorn, tinydb, agent_framework; print('ok')"

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:win

      - name: Report output sizes
        shell: pwsh
        run: |
          Get-ChildItem "dist" -File | Select-Object Name, @{
            Name = "SizeMB"
            Expression = { [math]::Round($_.Length / 1MB, 1) }
          } | Format-Table -AutoSize

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          archive: false

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
            Get-ChildItem "dist" -File -Filter "*.exe"
            Get-ChildItem "dist" -File -Filter "*.blockmap"
            Get-ChildItem "dist" -File -Filter "latest*.yml"
          )
          if (-not ($assets | Where-Object { $_.Extension -eq ".exe" })) {
            throw "Failed to find the generated Windows installer in dist/."
          }
          $assetPaths = $assets | ForEach-Object { $_.FullName }

          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assetPaths --clobber
          } else {
            gh release create $env:RELEASE_TAG @assetPaths --title $env:RELEASE_TAG --generate-notes --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
